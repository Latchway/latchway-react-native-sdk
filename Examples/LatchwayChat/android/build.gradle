buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.3.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

if (System.getenv('LATCHWAY_SHARED_NATIVE_SOURCE') == '1') {
    def nativeRepository = System.getenv('LATCHWAY_NATIVE_REPOSITORY')
    if (!nativeRepository) throw new GradleException('Set LATCHWAY_NATIVE_REPOSITORY to the tested local native publication repository.')
    allprojects {
        configurations.configureEach {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'dev.latchway' && details.requested.name in ['latchway-core', 'latchway-okhttp', 'latchway-play-integrity', 'latchway-firebase-auth', 'latchway-bom']) details.useVersion('1.1.0-dev')
            }
        }
        repositories {
            exclusiveContent {
                forRepository { maven { url = uri(nativeRepository) } }
                filter { includeGroup('dev.latchway') }
            }
        }
    }
}

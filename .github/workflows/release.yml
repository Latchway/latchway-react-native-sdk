      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Download and authenticate npm CLI without lifecycle scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          test "$NPM_CONFIG_IGNORE_SCRIPTS" = true
          test "$NPM_CLI_VERSION" = "$NPM_VERSION"
          test "$NPM_CLI_ARCHIVE" = "npm-$NPM_CLI_VERSION.tgz"
          test "$NPM_CLI_URL" = "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          [[ "$NPM_CLI_BYTES" =~ ^[1-9][0-9]{0,7}$ ]]
          [[ "$NPM_CLI_ENTRY_COUNT" =~ ^[1-9][0-9]{0,4}$ ]]
          [[ "$NPM_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NPM_CLI_SHA512" =~ ^[0-9a-f]{128}$ ]]
          [[ "$NPM_CLI_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$NPM_CLI_UNPACKED_BYTES" =~ ^[1-9][0-9]{0,8}$ ]]

          root="$RUNNER_TEMP/trusted-npm-cli"
          mkdir -m 700 "$root"
          archive="$root/$NPM_CLI_ARCHIVE"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 3145728 \
            --fail --silent --show-error --output "$archive" "$NPM_CLI_URL"

          shopt -s nullglob dotglob
          closure=("$root"/*)
          test "${#closure[@]}" = 1
          test "${closure[0]}" = "$archive"
          test -f "$archive"
          test ! -L "$archive"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$NPM_CLI_BYTES"
          printf '%s  %s\n' "$NPM_CLI_SHA256" "$archive" | sha256sum --check --strict
          printf '%s  %s\n' "$NPM_CLI_SHA512" "$archive" | sha512sum --check --strict
          observed_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
          test "$observed_integrity" = "$NPM_CLI_INTEGRITY"
          gzip --test "$archive"

          entry_count=0
          while IFS= read -r entry; do
            [[ "$entry" =~ ^package/([A-Za-z0-9@._+-]+/)*[A-Za-z0-9@._+-]+$ ]]
            ((entry_count += 1))
          done < <(tar --list --gzip --file "$archive")
          test "$entry_count" = "$NPM_CLI_ENTRY_COUNT"
          type_count=0
          while IFS= read -r listing; do
            test "${listing:0:1}" = '-'
            ((type_count += 1))
          done < <(tar --list --verbose --gzip --file "$archive")
          test "$type_count" = "$NPM_CLI_ENTRY_COUNT"

          inspection="$RUNNER_TEMP/trusted-npm-cli-inspection"
          mkdir -m 700 "$inspection"
          tar --extract --gzip --file "$archive" --directory "$inspection" \
            --no-same-owner --no-same-permissions
          test -z "$(find "$inspection" -mindepth 1 ! -type d ! -type f -print -quit)"
          test "$(find "$inspection" -type f | wc -l | tr -d ' ')" = "$NPM_CLI_ENTRY_COUNT"
          unpacked_bytes=$(find "$inspection" -type f -exec stat --format='%s' {} + | \
            awk '{ total += $1 } END { print total + 0 }')
          test "$unpacked_bytes" = "$NPM_CLI_UNPACKED_BYTES"
          jq --exit-status --arg version "$NPM_CLI_VERSION" '
            .name == "npm" and .version == $version and
            .bin.npm == "bin/npm-cli.js" and .bin.npx == "bin/npx-cli.js"
          ' "$inspection/package/package.json" >/dev/null
      - name: Transfer exact npm CLI tarball as inert data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-npm-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-npm-cli/npm-11.6.2.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  github-draft:
    name: Create or verify GitHub draft without candidate checkout
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: write
    outputs:
      release_state: ${{ steps.draft.outputs.release_state }}
    steps:
      - name: Preflight immutable release and create draft with fixed API calls
        id: draft
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          expected_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then expected_prerelease=true; fi
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          GH_TOKEN="$ADMIN_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$RUNNER_TEMP/immutable-release-settings.json"
          jq --exit-status '
            type == "object" and
            (keys | sort) == ["enabled", "enforced_by_owner"] and
            .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' "$RUNNER_TEMP/immutable-release-settings.json" >/dev/null
          unset ADMIN_TOKEN
          export GH_TOKEN="$RELEASE_TOKEN"
          unset RELEASE_TOKEN
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error.txt"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            test "$status" -eq 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/release-error.txt"
            prerelease=()
            if [[ "$expected_prerelease" == true ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "$RELEASE_TAG" "${prerelease[@]}"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          fi
          jq --exit-status --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
            --argjson prerelease "$expected_prerelease" '
            .tag_name == $tag and .name == $tag and .prerelease == $prerelease and
            (.draft | type) == "boolean" and (.immutable | type) == "boolean" and
            ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
            ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
            all(.assets[].name;
              . == ("latchway-react-native-" + $version + ".tgz") or
              . == ("latchway-react-native-" + $version + ".tgz.sha256") or
              . == "package-evidence.json" or . == "build-reproducibility.json" or
              . == "published-dependency-evidence.json" or . == "npm-registry-version.json" or
              . == "npm-registry-view.json" or . == "npm-attestations.json" or
              . == "npm-audit-signatures.json" or . == "npm-registry-evidence-manifest.json" or
              . == "post-publish-evidence.json" or
              test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))
          ' "$RUNNER_TEMP/release.json" >/dev/null
          state=draft
          if [[ "$(jq --raw-output .immutable "$RUNNER_TEMP/release.json")" == true ]]; then state=immutable; fi
          printf 'release_state=%s\n' "$state" >> "$GITHUB_OUTPUT"

  npm-publish:
    name: Publish or adopt npm archive without candidate checkout
    needs: [promote, verify, android, ios, trusted-npm-cli, github-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      publish_performed: ${{ steps.registry.outputs.publish_performed }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Download exact credential-free npm CLI handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-npm-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-npm-cli
      - name: Verify exact npm CLI closure before extraction or execution
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          test "$NPM_CONFIG_IGNORE_SCRIPTS" = true
          test "$NPM_CLI_VERSION" = "$NPM_VERSION"
          test "$NPM_CLI_ARCHIVE" = "npm-$NPM_CLI_VERSION.tgz"
          test "$NPM_CLI_URL" = "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          [[ "$NPM_CLI_BYTES" =~ ^[1-9][0-9]{0,7}$ ]]
          [[ "$NPM_CLI_ENTRY_COUNT" =~ ^[1-9][0-9]{0,4}$ ]]
          [[ "$NPM_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NPM_CLI_SHA512" =~ ^[0-9a-f]{128}$ ]]
          [[ "$NPM_CLI_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$NPM_CLI_UNPACKED_BYTES" =~ ^[1-9][0-9]{0,8}$ ]]

          root="$RUNNER_TEMP/trusted-npm-cli"
          archive="$root/$NPM_CLI_ARCHIVE"
          shopt -s nullglob dotglob
          closure=("$root"/*)
          test "${#closure[@]}" = 1
          test "${closure[0]}" = "$archive"
          test -f "$archive"
          test ! -L "$archive"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$NPM_CLI_BYTES"
          printf '%s  %s\n' "$NPM_CLI_SHA256" "$archive" | sha256sum --check --strict
          printf '%s  %s\n' "$NPM_CLI_SHA512" "$archive" | sha512sum --check --strict
          observed_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
          test "$observed_integrity" = "$NPM_CLI_INTEGRITY"
          gzip --test "$archive"

          entry_count=0
          while IFS= read -r entry; do
            [[ "$entry" =~ ^package/([A-Za-z0-9@._+-]+/)*[A-Za-z0-9@._+-]+$ ]]
            ((entry_count += 1))
          done < <(tar --list --gzip --file "$archive")
          test "$entry_count" = "$NPM_CLI_ENTRY_COUNT"
          type_count=0
          while IFS= read -r listing; do
            test "${listing:0:1}" = '-'
            ((type_count += 1))
          done < <(tar --list --verbose --gzip --file "$archive")
          test "$type_count" = "$NPM_CLI_ENTRY_COUNT"

          runtime="$RUNNER_TEMP/trusted-npm-cli-runtime"
          mkdir -m 700 "$runtime"
          tar --extract --gzip --file "$archive" --directory "$runtime" \
            --no-same-owner --no-same-permissions
          test -z "$(find "$runtime" -mindepth 1 ! -type d ! -type f -print -quit)"
          test "$(find "$runtime" -type f | wc -l | tr -d ' ')" = "$NPM_CLI_ENTRY_COUNT"
          unpacked_bytes=$(find "$runtime" -type f -exec stat --format='%s' {} + | \
            awk '{ total += $1 } END { print total + 0 }')
          test "$unpacked_bytes" = "$NPM_CLI_UNPACKED_BYTES"
          jq --exit-status --arg version "$NPM_CLI_VERSION" '
            .name == "npm" and .version == $version and
            .bin.npm == "bin/npm-cli.js" and .bin.npx == "bin/npx-cli.js"
          ' "$runtime/package/package.json" >/dev/null
          cli="$runtime/package/bin/npm-cli.js"
          test -f "$cli"
          test ! -L "$cli"
          test "$("$cli" --version)" = "$NPM_CLI_VERSION"
          printf 'LATCHWAY_NPM_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
      - name: Download exact reviewed package without candidate source
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latchway-react-native-release
          path: ${{ runner.temp }}/reviewed-release
      - name: Validate reviewed archive identity and checksum with fixed tooling
        shell: bash
        env:
          RELEASE_STATE: ${{ needs.github-draft.outputs.release_state }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$RELEASE_STATE" == draft || "$RELEASE_STATE" == immutable ]]
          root="$RUNNER_TEMP/reviewed-release"
          archive="$root/latchway-react-native-$RELEASE_VERSION.tgz"
          evidence="$root/package-evidence.json"
          test -s "$archive"
          test ! -L "$archive"
          test -s "$evidence"
          (cd "$root" && sha256sum --check "latchway-react-native-$RELEASE_VERSION.tgz.sha256")
          jq --exit-status --arg version "$RELEASE_VERSION" \
            --arg archive "latchway-react-native-$RELEASE_VERSION.tgz" '
            .schema_version == 1 and .package == "@latchway/react-native" and
            .version == $version and .tarball == $archive and
            (.bytes | type) == "number" and .bytes > 0 and
            (.sha256 | test("^[0-9a-f]{64}$")) and
            (.integrity | test("^sha512-[A-Za-z0-9+/]+={0,2}$"))
          ' "$evidence" >/dev/null
          test "$(jq --raw-output .bytes "$evidence")" = "$(wc -c < "$archive" | tr -d ' ')"
          test "$(jq --raw-output .sha256 "$evidence")" = "$(sha256sum "$archive" | cut -d ' ' -f 1)"
          test "$(tar -xOzf "$archive" package/package.json | jq --raw-output .name)" = '@latchway/react-native'
          test "$(tar -xOzf "$archive" package/package.json | jq --raw-output .version)" = "$RELEASE_VERSION"
      - name: Attest reviewed npm package and reproducibility inputs without candidate checkout
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/reviewed-release/latchway-react-native-${{ needs.promote.outputs.version }}.tgz
            ${{ runner.temp }}/reviewed-release/package-evidence.json
            ${{ runner.temp }}/reviewed-release/build-reproducibility.json
            ${{ runner.temp }}/reviewed-release/published-dependency-evidence.json
      - name: Publish or adopt exact npm bytes with fixed commands
        id: registry
        shell: bash
        env:
          RELEASE_STATE: ${{ needs.github-draft.outputs.release_state }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/reviewed-release"
          archive="$root/latchway-react-native-$RELEASE_VERSION.tgz"
          expected_integrity=$(jq --exit-status --raw-output .integrity "$root/package-evidence.json")
          metadata="$RUNNER_TEMP/npm-version.json"
          status=$(curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
            --silent --show-error --output "$metadata" --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40latchway%2Freact-native/$RELEASE_VERSION")
          publish_performed=false
          if [[ "$status" == 200 ]]; then
            test "$(jq --raw-output .name "$metadata")" = '@latchway/react-native'
            test "$(jq --raw-output .version "$metadata")" = "$RELEASE_VERSION"
            test "$(jq --raw-output .dist.integrity "$metadata")" = "$expected_integrity"
            tarball=$(jq --exit-status --raw-output '.dist.tarball | strings' "$metadata")
            test "$tarball" = "https://registry.npmjs.org/@latchway/react-native/-/react-native-$RELEASE_VERSION.tgz"
            curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 --max-filesize 20971520 \
              --fail --silent --show-error --output "$RUNNER_TEMP/existing.tgz" "$tarball"
            cmp --silent "$archive" "$RUNNER_TEMP/existing.tgz"
          else
            test "$status" = 404
            test "$RELEASE_STATE" = draft
            tag=latest
            if [[ "$RELEASE_VERSION" == *-* ]]; then tag=next; fi
            "$LATCHWAY_NPM_CLI" publish "$archive" --access public --provenance --tag "$tag" \
              --registry=https://registry.npmjs.org/
            publish_performed=true
          fi
          printf 'publish_performed=%s\n' "$publish_performed" >> "$GITHUB_OUTPUT"


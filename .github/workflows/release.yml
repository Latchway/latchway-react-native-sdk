            .bin.npm == "bin/npm-cli.js" and .bin.npx == "bin/npx-cli.js"
          ' "$runtime/package/package.json" >/dev/null
          cli="$runtime/package/bin/npm-cli.js"
          test -f "$cli"
          test ! -L "$cli"
          test "$("$cli" --version)" = "$NPM_CLI_VERSION"
          printf 'LATCHWAY_NPM_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latchway-react-native-release
          path: .release
      - name: Verify downloaded archive checksum and release tag without credentials
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          (cd ../.release && sha256sum --check "latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256")
        working-directory: latchway-react-native-sdk
      - name: Validate promoted React Native release source without credentials
        run: |
          set -euo pipefail
          node scripts/release-preflight.mjs "$RELEASE_TAG"
        working-directory: latchway-react-native-sdk
      - name: Verify registry bytes, signatures, and exact trusted-publisher provenance
        id: registry_evidence
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          PUBLISH_PERFORMED: ${{ needs.npm-publish.outputs.publish_performed }}
        run: node scripts/verify-published.mjs "../.release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz"
        working-directory: latchway-react-native-sdk
      - name: Stage exact React Native assets for isolated GitHub publication
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/react-native-release-assets"
          mkdir -m 700 "$destination"
          install -m 600 -- \
            "../.release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz" \
            "../.release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256" \
            "../.release/docs-bundle-${{ steps.lock.outputs.react_native_version }}.tar.gz" \
            ../.release/package-evidence.json \
            ../.release/build-reproducibility.json \
            ../.release/published-dependency-evidence.json \
            ../.release/npm-registry-version.json \
            ../.release/npm-registry-view.json \
            ../.release/npm-attestations.json \
            ../.release/npm-audit-signatures.json \
            ../.release/npm-registry-evidence-manifest.json \
            ../.release/post-publish-evidence.json \
            "../.release/${{ steps.registry_evidence.outputs.adoption_asset }}" \
            "$destination/"
        working-directory: latchway-react-native-sdk
      - name: Transfer exact React Native assets to the no-checkout publication job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-react-native-github-release-${{ needs.promote.outputs.version }}
          path: ${{ runner.temp }}/react-native-release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  github-release-policy:
    name: Re-verify immutable release policy without OIDC or candidate checkout
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: [promote, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
    steps:
      - name: Verify immutable releases remain enforced with the protected admin credential
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          GH_TOKEN="$ADMIN_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$RUNNER_TEMP/immutable-release-settings.json"
          unset ADMIN_TOKEN
          jq --exit-status '
            type == "object" and
            (keys | sort) == ["enabled", "enforced_by_owner"] and
            .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' "$RUNNER_TEMP/immutable-release-settings.json" >/dev/null

  github-release:
    name: Publish immutable GitHub release without candidate checkout
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: [promote, publish, github-release-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download exact React Native release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-react-native-github-release-${{ needs.promote.outputs.version }}
          path: ${{ runner.temp }}/react-native-release-assets
      - name: Validate exact React Native asset closure before OIDC attestation
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          asset_root="$RUNNER_TEMP/react-native-release-assets"
          shopt -s nullglob
          adoption_assets=("$asset_root"/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 1
          adoption_name=${adoption_assets[0]##*/}
          [[ "$adoption_name" =~ ^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
          expected=(
            "latchway-react-native-$RELEASE_VERSION.tgz"
            "latchway-react-native-$RELEASE_VERSION.tgz.sha256"
            "docs-bundle-$RELEASE_VERSION.tar.gz"
            package-evidence.json
            build-reproducibility.json
            published-dependency-evidence.json
            npm-registry-version.json
            npm-registry-view.json
            npm-attestations.json
            npm-audit-signatures.json
            npm-registry-evidence-manifest.json
            post-publish-evidence.json
            "$adoption_name"
          )
          actual=("$asset_root"/*)
          test "${#actual[@]}" = "${#expected[@]}"
          for asset in "${actual[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          printf '%s\n' "${actual[@]##*/}" | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          cmp --silent "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: Attest exact retained registry and release evidence without candidate checkout
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/react-native-release-assets/*
      - name: Reconcile, publish, and verify immutable release with fixed API calls
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          expected_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then expected_prerelease=true; fi
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh release verify --help | grep --fixed-strings -- '--format' >/dev/null
          gh release verify-asset --help | grep --fixed-strings -- '--format' >/dev/null
          export GH_TOKEN="$RELEASE_TOKEN"
          unset RELEASE_TOKEN

          asset_root="$RUNNER_TEMP/react-native-release-assets"
          adoption_assets=("$asset_root"/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 1
          [[ "${adoption_assets[0]##*/}" =~ ^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
          fixed_assets=(
            "$asset_root/latchway-react-native-$RELEASE_VERSION.tgz"
            "$asset_root/latchway-react-native-$RELEASE_VERSION.tgz.sha256"
            "$asset_root/docs-bundle-$RELEASE_VERSION.tar.gz"
            "$asset_root/package-evidence.json"
            "$asset_root/build-reproducibility.json"
            "$asset_root/published-dependency-evidence.json"
            "$asset_root/npm-registry-version.json"
            "$asset_root/npm-registry-view.json"
            "$asset_root/npm-attestations.json"
            "$asset_root/npm-audit-signatures.json"
            "$asset_root/npm-registry-evidence-manifest.json"
            "$asset_root/post-publish-evidence.json"
          )
          : > "$RUNNER_TEMP/fixed-assets.txt"
          for asset in "${fixed_assets[@]}" "${adoption_assets[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          for asset in "${fixed_assets[@]}"; do printf '%s\n' "${asset##*/}" >> "$RUNNER_TEMP/fixed-assets.txt"; done
          test "$(sort -u "$RUNNER_TEMP/fixed-assets.txt" | wc -l | tr -d ' ')" = 12
          fixed_names=$(sort "$RUNNER_TEMP/fixed-assets.txt" | jq --raw-input --slurp 'split("\n")[:-1]')

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null
          lookup_release() {
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          }
          lookup_release
          validate_release() {
            local allow_draft=$1
            jq --exit-status --arg tag "$RELEASE_TAG" --argjson prerelease "$expected_prerelease" \
              --argjson fixed "$fixed_names" --argjson allow_draft "$allow_draft" '
              . as $release |
              .tag_name == $tag and .name == $tag and .prerelease == $prerelease and
              (.draft | type) == "boolean" and (.immutable | type) == "boolean" and
              ($allow_draft or .draft == false) and
              ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
              ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
              all($release.assets[].name as $name; ($fixed | index($name)) != null or
                ($name | test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$")))
            ' "$RUNNER_TEMP/release.json" >/dev/null
          }
          validate_release true
          verify_or_upload() {
            local asset=$1 name remote_count remote_id remote_size downloaded
            name=${asset##*/}
            remote_count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")
            test "$remote_count" -le 1
            if [[ "$remote_count" -eq 1 ]]; then
              remote_id=$(jq --raw-output --arg name "$name" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/release.json")
              remote_size=$(jq --raw-output --arg name "$name" '.assets[] | select(.name == $name) | .size' "$RUNNER_TEMP/release.json")
              test "$remote_size" = "$(wc -c < "$asset" | tr -d ' ')"
              downloaded="$RUNNER_TEMP/existing-$name"
              gh api --method GET -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$remote_id" > "$downloaded"
              cmp --silent "$asset" "$downloaded"
              return
            fi
            test "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" = true
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          }
          for asset in "${fixed_assets[@]}"; do verify_or_upload "$asset"; done
          adoption_name=${adoption_assets[0]##*/}
          if [[ "$(jq --arg name "$adoption_name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")" -eq 1 ||
                "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == true ]]; then
            verify_or_upload "${adoption_assets[0]}"
          else
            test "$(jq '[.assets[].name | select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length' "$RUNNER_TEMP/release.json")" -ge 1
          fi
          lookup_release
          validate_release true
          jq --exit-status --argjson fixed "$fixed_names" '. as $release |
            all($fixed[] as $name; ($release.assets | map(.name) | index($name)) != null) and
            ([$release.assets[].name | select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length) >= 1
          ' "$RUNNER_TEMP/release.json" >/dev/null
          if [[ "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == true ]]; then
            if [[ "$expected_prerelease" == true ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
            fi
          fi
          lookup_release
          validate_release false
          jq --exit-status --argjson fixed "$fixed_names" '. as $release |
            all($fixed[] as $name; ($release.assets | map(.name) | index($name)) != null) and
            ([$release.assets[].name | select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length) >= 1
          ' "$RUNNER_TEMP/release.json" >/dev/null
          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/release-attestation.json"; then verified=true; break; fi
            test "$attempt" = 12 || sleep 10
          done
          test "$verified" = true
          for asset in "${fixed_assets[@]}"; do
            verified=false
            for attempt in $(seq 1 12); do
              if gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --format json \
                > "$RUNNER_TEMP/${asset##*/}.attestation.json"; then verified=true; break; fi
              test "$attempt" = 12 || sleep 10
            done
            test "$verified" = true
          done

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0
  NPM_VERSION: 11.6.2

jobs:
  verify:
    name: Verify immutable release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - name: Check out locked JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ steps.lock.outputs.javascript_commit }}
          path: latchway-js
          persist-credentials: false
      - name: Check out locked iOS SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-ios-sdk
          ref: ${{ steps.lock.outputs.ios_commit }}
          path: latchway-ios-sdk
          persist-credentials: false
      - name: Check out locked Android SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-android
          ref: ${{ steps.lock.outputs.android_commit }}
          path: latchway-android
          persist-credentials: false
      - name: Check out locked core contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ steps.lock.outputs.core_commit }}
          path: latchway
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Build exact JavaScript source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: latchway-js
      - name: Install exact React Native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Verify tag, release metadata, and all locked source commits
        run: |
          pnpm release:preflight -- "$GITHUB_REF_NAME"
          pnpm verify:compatibility --sources
        working-directory: latchway-react-native-sdk
      - name: Verify locked public SDK releases
        run: node scripts/verify-published-dependencies.mjs --all
        working-directory: latchway-react-native-sdk
      - name: Build and verify immutable core contract bundle
        run: |
          mkdir -p "$RUNNER_TEMP/latchway-contract"
          python3 scripts/build-contract-bundle.py --output-directory "$RUNNER_TEMP/latchway-contract"
          pnpm --dir ../latchway-react-native-sdk verify:bundle -- "$RUNNER_TEMP/latchway-contract/latchway-contract-${{ steps.lock.outputs.contract_version }}.tar.gz"
        working-directory: latchway
      - name: Run JavaScript and package release gates
        run: |
          pnpm check
          pnpm pack:check
          pnpm verify:reproducible
          pnpm consumer:check --published
        working-directory: latchway-react-native-sdk
      - name: Upload immutable release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-react-native-release
          path: |
            latchway-react-native-sdk/.artifacts/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz
            latchway-react-native-sdk/.artifacts/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30

  android:
    name: Verify published Android consumer
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - name: Check out locked JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ steps.lock.outputs.javascript_commit }}
          path: latchway-js
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: sdkmanager "platforms;android-${{ steps.lock.outputs.android_compile_sdk }}" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Build exact JavaScript source and install workspace
        run: |
          pnpm --dir ../latchway-js install --frozen-lockfile
          pnpm --dir ../latchway-js build
          pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Compile standalone bridge against public Maven coordinates
        run: ./android/gradlew -p android clean check --no-daemon
        working-directory: latchway-react-native-sdk
      - name: Compile and lint official Android host
        run: ./android/gradlew -p example/android :app:compileDebugKotlin :app:lintDebug --no-daemon
        working-directory: latchway-react-native-sdk

  ios:
    name: Verify published iOS consumer
    needs: verify
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out tagged React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - name: Check out locked JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ steps.lock.outputs.javascript_commit }}
          path: latchway-js
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build exact JavaScript source and install workspace
        run: |
          pnpm --dir ../latchway-js install --frozen-lockfile
          pnpm --dir ../latchway-js build
          pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Resolve public CocoaPods dependency
        env:
          RCT_NEW_ARCH_ENABLED: "1"
        run: pod install --repo-update
        working-directory: latchway-react-native-sdk/example/ios
      - name: Build official iOS host
        run: >-
          xcodebuild
          -workspace LatchwayExample.xcworkspace
          -scheme LatchwayExample
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/latchway-rn-ios-release"
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: latchway-react-native-sdk/example/ios

  publish:
    name: Publish npm package and GitHub release
    needs: [verify, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latchway-react-native-release
          path: .release
      - name: Verify downloaded archive checksum and release tag
        run: |
          (cd ../.release && sha256sum --check "latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256")
          node scripts/release-preflight.mjs "$GITHUB_REF_NAME"
        working-directory: latchway-react-native-sdk
      - name: Create recoverable draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists; preserving it for an idempotent retry."
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --generate-notes --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Publish or verify exact npm archive with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-or-verify.mjs "../.release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz"
        working-directory: latchway-react-native-sdk
      - name: Attach archive and finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" .release/* --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

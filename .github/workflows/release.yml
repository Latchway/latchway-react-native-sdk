name: Release

on:
  repository_dispatch:
    types: [latchway_release_promoted]

permissions:
  contents: read

concurrency:
  group: react-native-release-${{ github.event.client_payload.repository.commit }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0
  NPM_VERSION: 11.6.2
  NPM_CLI_ARCHIVE: npm-11.6.2.tgz
  NPM_CLI_BYTES: "2663834"
  NPM_CLI_ENTRY_COUNT: "2133"
  NPM_CLI_INTEGRITY: sha512-7iKzNfy8lWYs3zq4oFPa8EXZz5xt9gQNKJZau3B1ErLBb6bF7sBJ00x09485DOvRT2l5Gerbl3VlZNT57MxJVA==
  NPM_CLI_SHA256: 585f95094ee5cb2788ee11d90f2a518a7c9ef6e083fa141d0b63ca3383675a20
  NPM_CLI_SHA512: ee22b335fcbc95662cdf3ab8a053daf045d9cf9c6df6040d28965abb707512b2c16fa6c5eec049d34c74f78f390cebd14f697919eadb97756564d4f9eccc4954
  NPM_CLI_UNPACKED_BYTES: "11785613"
  NPM_CLI_URL: https://registry.npmjs.org/npm/-/npm-11.6.2.tgz
  NPM_CLI_VERSION: 11.6.2

jobs:
  authorize-promotion:
    name: Authenticate core promotion without candidate source
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    outputs:
      commit: ${{ steps.coordinates.outputs.commit }}
    steps:
      - name: Validate dispatch envelope before network access
        id: coordinates
        shell: bash
        env:
          SDK_ID: ${{ github.event.client_payload.repository.id }}
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$SDK_ID" = react_native
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$SDK_TAG" = "v$SDK_VERSION"
          [[ "$CORE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          test "$GITHUB_SHA" = "$SDK_COMMIT"
          printf 'commit=%s\n' "$SDK_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Require fixed GitHub attestation tooling without credentials
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh attestation verify --help >/dev/null
      - name: Download and hash the exact core promotion report
        shell: bash
        env:
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          CORE_READ_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          auth_config="$RUNNER_TEMP/latchway-core-release-auth"
          trap 'rm -f -- "$auth_config"' EXIT
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$CORE_READ_TOKEN" > "$auth_config"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --config "$auth_config" \
            --connect-timeout 15 --max-time 120 --max-filesize 2097152 \
            --fail --location --silent --show-error --output "$report" "$REPORT_URL"
          rm -f -- "$auth_config"
          trap - EXIT
          printf '%s  %s\n' "$REPORT_SHA256" "$report" | sha256sum --check --strict
      - name: Verify the core workflow artifact attestation with read-only credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --repo Latchway/latchway \
            --signer-workflow Latchway/latchway/.github/workflows/cross-repository-conformance.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Transfer authenticated promotion report to credential-free validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-core-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-cross-repository-promotion.json
          if-no-files-found: error
          retention-days: 1

  verify-promotion:
    name: Validate candidate source against authenticated promotion
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: authorize-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      android_commit: ${{ steps.lock.outputs.android_commit }}
      android_version: ${{ steps.lock.outputs.android_version }}
      commit: ${{ steps.promotion.outputs.release_commit }}
      contract_version: ${{ steps.lock.outputs.contract_version }}
      core_commit: ${{ steps.lock.outputs.core_commit }}
      core_tag: ${{ steps.promotion.outputs.core_tag }}
      ios_commit: ${{ steps.lock.outputs.ios_commit }}
      ios_version: ${{ steps.lock.outputs.ios_version }}
      javascript_commit: ${{ steps.lock.outputs.javascript_commit }}
      javascript_version: ${{ steps.lock.outputs.javascript_version }}
      react_native_version: ${{ steps.lock.outputs.react_native_version }}
      report_sha256: ${{ steps.promotion.outputs.report_sha256 }}
      tag: ${{ steps.promotion.outputs.release_tag }}
      version: ${{ steps.promotion.outputs.release_version }}
    steps:
      - name: Check out exact promoted React Native SDK source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize-promotion.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download authenticated core promotion report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-core-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-core-promotion
      - name: Validate exact report, dispatch, and local source bindings without credentials
        id: promotion
        shell: bash
        env:
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SDK_COMMIT"
          python3 scripts/verify-release-promotion.py \
            --report "$RUNNER_TEMP/sdk-core-promotion/latchway-cross-repository-promotion.json" \
            --report-url "$REPORT_URL" \
            --report-sha256 "$REPORT_SHA256" \
            --repository-id react_native \
            --repository-commit "$SDK_COMMIT" \
            --repository-version "$SDK_VERSION" \
            --repository-tag "$SDK_TAG" \
            --workflow-commit "$GITHUB_SHA" \
            --core-tag "$CORE_TAG" \
            --oci-image-digest "$OCI_IMAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"
      - name: Export bounded immutable dependency coordinates without credentials
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          lock=release-compatibility.json
          emit_commit() {
            local name=$1 filter=$2 value
            value=$(jq --exit-status --raw-output "$filter | strings" "$lock")
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          }
          emit_version() {
            local name=$1 filter=$2 value
            value=$(jq --exit-status --raw-output "$filter | strings" "$lock")
            [[ "$value" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          }
          emit_commit android_commit .android.source_commit
          emit_version android_version .android.version
          emit_version contract_version .contract.version
          emit_commit core_commit .contract.core_commit
          emit_commit ios_commit .ios.source_commit
          emit_version ios_version .ios.version
          emit_commit javascript_commit .javascript.source_commit
          emit_version javascript_version .javascript.version
          emit_version react_native_version .react_native.version
          test "$(jq --raw-output '.react_native.package' "$lock")" = '@latchway/react-native'
          test "$(jq --raw-output '.javascript.package' "$lock")" = '@latchway/client'
          test "$(jq --raw-output '.ios.pod' "$lock")" = 'Latchway/AppAttest'
          test "$(jq --raw-output '.android.group' "$lock")" = 'dev.latchway'
          test "$(jq --raw-output '.javascript.repository' "$lock")" = 'https://github.com/Latchway/latchway-js.git'
          test "$(jq --raw-output '.ios.repository' "$lock")" = 'https://github.com/Latchway/latchway-ios-sdk.git'
          test "$(jq --raw-output '.android.repository' "$lock")" = 'https://github.com/Latchway/latchway-android.git'
          test "$(jq --raw-output '.contract.repository' "$lock")" = 'https://github.com/Latchway/latchway.git'

  promote:
    name: Create or verify evidence-gated SDK tag without checkout
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: verify-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ needs.verify-promotion.outputs.commit }}
      tag: ${{ needs.verify-promotion.outputs.tag }}
      version: ${{ needs.verify-promotion.outputs.version }}
      core_tag: ${{ needs.verify-promotion.outputs.core_tag }}
      report_sha256: ${{ needs.verify-promotion.outputs.report_sha256 }}
    steps:
      - name: Create or verify evidence-gated annotated SDK tag using fixed API calls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify-promotion.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify-promotion.outputs.tag }}
          CORE_TAG: ${{ needs.verify-promotion.outputs.core_tag }}
          REPORT_SHA256: ${{ needs.verify-promotion.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          message="React Native SDK $RELEASE_TAG

          Core promotion: $CORE_TAG
          Promotion evidence SHA-256: $REPORT_SHA256"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/sdk-tag-ref.json" 2> "$RUNNER_TEMP/sdk-tag-error.txt"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            test "$lookup_status" -eq 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/sdk-tag-error.txt"
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" \
              --arg object "$RELEASE_COMMIT" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
              > "$RUNNER_TEMP/sdk-tag-object-create.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              --input "$RUNNER_TEMP/sdk-tag-object-create.json" > "$RUNNER_TEMP/sdk-tag-result.json"
            tag_object=$(jq --raw-output '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              "$RUNNER_TEMP/sdk-tag-result.json")
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" \
              '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/sdk-tag-ref-create.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --input "$RUNNER_TEMP/sdk-tag-ref-create.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/sdk-tag-ref.json"
          fi
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/sdk-tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/sdk-tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/sdk-tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/sdk-tag-object.json" >/dev/null

  locked-sources:
    name: Fetch immutable sibling sources without candidate checkout
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: verify-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: private-sibling-read
    permissions:
      contents: read
    steps:
      - name: Validate locked source coordinates before credentials
        shell: bash
        env:
          ANDROID_COMMIT: ${{ needs.verify-promotion.outputs.android_commit }}
          CORE_COMMIT: ${{ needs.verify-promotion.outputs.core_commit }}
          IOS_COMMIT: ${{ needs.verify-promotion.outputs.ios_commit }}
          JAVASCRIPT_COMMIT: ${{ needs.verify-promotion.outputs.javascript_commit }}
        run: |
          set -euo pipefail
          for commit in "$ANDROID_COMMIT" "$CORE_COMMIT" "$IOS_COMMIT" "$JAVASCRIPT_COMMIT"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          done
      - name: Check out locked JavaScript SDK without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ needs.verify-promotion.outputs.javascript_commit }}
          path: latchway-js
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked iOS SDK without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-ios-sdk
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ needs.verify-promotion.outputs.ios_commit }}
          path: latchway-ios-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked Android SDK without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-android
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ needs.verify-promotion.outputs.android_commit }}
          path: latchway-android
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked core contract without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          token: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ref: ${{ needs.verify-promotion.outputs.core_commit }}
          path: latchway
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checked-out commits without executing source
        shell: bash
        env:
          ANDROID_COMMIT: ${{ needs.verify-promotion.outputs.android_commit }}
          CORE_COMMIT: ${{ needs.verify-promotion.outputs.core_commit }}
          IOS_COMMIT: ${{ needs.verify-promotion.outputs.ios_commit }}
          JAVASCRIPT_COMMIT: ${{ needs.verify-promotion.outputs.javascript_commit }}
        run: |
          set -euo pipefail
          test "$(git -C latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test "$(git -C latchway-ios-sdk rev-parse --verify HEAD)" = "$IOS_COMMIT"
          test "$(git -C latchway-android rev-parse --verify HEAD)" = "$ANDROID_COMMIT"
          test "$(git -C latchway rev-parse --verify HEAD)" = "$CORE_COMMIT"
          for repository in latchway-js latchway-ios-sdk latchway-android latchway; do
            test -z "$(git -C "$repository" config --local --get-all http.https://github.com/.extraheader || true)"
          done
      - name: Create transport-safe exact Git bundles without executing source
        shell: bash
        run: |
          set -euo pipefail
          git -C latchway-js bundle create "$RUNNER_TEMP/locked-latchway-js.bundle" HEAD
          git -C latchway-ios-sdk bundle create "$RUNNER_TEMP/locked-latchway-ios.bundle" HEAD
          git -C latchway-android bundle create "$RUNNER_TEMP/locked-latchway-android.bundle" HEAD
          git -C latchway bundle create "$RUNNER_TEMP/locked-latchway-core.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/locked-latchway-js.bundle"
          git bundle verify "$RUNNER_TEMP/locked-latchway-ios.bundle"
          git bundle verify "$RUNNER_TEMP/locked-latchway-android.bundle"
          git bundle verify "$RUNNER_TEMP/locked-latchway-core.bundle"
      - name: Transfer locked JavaScript source to credential-free jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-latchway-js-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-latchway-js.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Transfer locked iOS source to credential-free jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-latchway-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-latchway-ios.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Transfer locked Android source to credential-free jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-latchway-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-latchway-android.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Transfer locked core source to credential-free jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-latchway-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-latchway-core.bundle
          if-no-files-found: error
          retention-days: 1

  published-dependencies:
    name: Authenticate published sibling inputs without candidate checkout
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: verify-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: private-sibling-read
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Require fixed GitHub release tooling without credentials
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh release verify --help | grep --fixed-strings -- '--format' >/dev/null
          gh release verify-asset --help | grep --fixed-strings -- '--format' >/dev/null
          gh attestation verify --help >/dev/null
      - name: Download and authenticate exact private release inputs with fixed API calls
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
          ANDROID_COMMIT: ${{ needs.verify-promotion.outputs.android_commit }}
          ANDROID_VERSION: ${{ needs.verify-promotion.outputs.android_version }}
          CORE_COMMIT: ${{ needs.verify-promotion.outputs.core_commit }}
          CORE_TAG: ${{ needs.verify-promotion.outputs.core_tag }}
          IOS_COMMIT: ${{ needs.verify-promotion.outputs.ios_commit }}
          IOS_VERSION: ${{ needs.verify-promotion.outputs.ios_version }}
          JAVASCRIPT_COMMIT: ${{ needs.verify-promotion.outputs.javascript_commit }}
          JAVASCRIPT_VERSION: ${{ needs.verify-promotion.outputs.javascript_version }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          for commit in "$ANDROID_COMMIT" "$CORE_COMMIT" "$IOS_COMMIT" "$JAVASCRIPT_COMMIT"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          done
          for version in "$ANDROID_VERSION" "$IOS_VERSION" "$JAVASCRIPT_VERSION"; do
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          done
          [[ "$CORE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

          root="$RUNNER_TEMP/published-dependency-inputs"
          mkdir -m 700 "$root"

          retry_to_file() {
            local output=$1
            shift
            local temporary_output="${output}.partial"
            for attempt in $(seq 1 180); do
              if "$@" > "$temporary_output"; then
                test -s "$temporary_output"
                mv -- "$temporary_output" "$output"
                return 0
              fi
              rm -f -- "$temporary_output"
              if [[ "$attempt" -eq 180 ]]; then
                echo "Authenticated dependency input did not become available within 90 minutes." >&2
                return 1
              fi
              sleep 30
            done
          }

          authenticate_tag() {
            local repository=$1 tag=$2 commit=$3 directory=$4
            retry_to_file "$directory/tag-ref.json" \
              gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$repository/git/ref/tags/$tag"
            local tag_object
            tag_object=$(jq --exit-status --raw-output \
              '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              "$directory/tag-ref.json")
            test "$(jq --raw-output .object.type "$directory/tag-ref.json")" = tag
            retry_to_file "$directory/tag-object.json" \
              gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$repository/git/tags/$tag_object"
            jq --exit-status --arg tag "$tag" --arg commit "$commit" --arg object "$tag_object" '
              .sha == $object and .tag == $tag and .object.type == "commit" and .object.sha == $commit
            ' "$directory/tag-object.json" >/dev/null
          }

          requires_build_attestation() {
            local kind=$1 name=$2
            if [[ "$kind" == android ]]; then return 0; fi
            if [[ "$kind" == ios ]]; then [[ "$name" != *.tar.gz.sha256 ]]; return; fi
            case "$name" in
              latchway-client-*.tgz|build-reproducibility.json|package-evidence.json|post-publish-evidence.json|\
              npm-registry-version.json|npm-registry-view.json|npm-attestations.json|\
              npm-audit-signatures.json|npm-registry-evidence-manifest.json|npm-release-adoption-*.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          authenticate_release() {
            local kind=$1 repository=$2 tag=$3 commit=$4
            shift 4
            local directory="$root/$kind"
            mkdir -m 700 "$directory" "$directory/assets" "$directory/asset-attestations" \
              "$directory/build-attestations"
            authenticate_tag "$repository" "$tag" "$commit" "$directory"
            retry_to_file "$directory/release.json" \
              gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$repository/releases/tags/$tag"
            local fixed_json
            fixed_json=$(printf '%s\n' "$@" | sort | jq --raw-input --slurp 'split("\n")[:-1]')
            test "$(jq --argjson fixed "$fixed_json" '$fixed | length == ($fixed | unique | length)' \
              "$directory/release.json")" = true
            jq --exit-status --arg tag "$tag" --arg kind "$kind" --argjson fixed "$fixed_json" '
              . as $release |
              .tag_name == $tag and .draft == false and .immutable == true and
              ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
              all($fixed[] as $name; ($release.assets | map(.name) | index($name)) != null) and
              if $kind == "javascript" then
                all($release.assets[].name as $name;
                  ($fixed | index($name)) != null or
                  ($name | test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))) and
                ([$release.assets[].name |
                  select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length) >= 1
              else
                ([$release.assets[].name] | sort) == ($fixed | sort)
              end
            ' "$directory/release.json" >/dev/null

            while IFS=$'\t' read -r asset_id name expected_size expected_digest; do
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
              [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
              [[ -z "$expected_digest" || "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              local asset="$directory/assets/$name"
              gh api --method GET \
                -H 'Accept: application/octet-stream' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$repository/releases/assets/$asset_id" > "$asset"
              test -s "$asset"
              test "$(wc -c < "$asset" | tr -d ' ')" = "$expected_size"
              if [[ -n "$expected_digest" ]]; then
                test "sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)" = "$expected_digest"
              fi
            done < <(jq --raw-output '.assets[] |
              [.id, .name, .size, (.digest // "")] | @tsv' "$directory/release.json")

            retry_to_file "$directory/release-attestation.json" \
              gh release verify "$tag" --repo "$repository" --format json
            while IFS= read -r name; do
              local asset="$directory/assets/$name"
              retry_to_file "$directory/asset-attestations/$name.json" \
                gh release verify-asset "$tag" "$asset" --repo "$repository" --format json
              if requires_build_attestation "$kind" "$name"; then
                retry_to_file "$directory/build-attestations/$name.gh-output" \
                  gh attestation verify "$asset" \
                    --repo "$repository" \
                    --signer-workflow "$repository/.github/workflows/release.yml" \
                    --source-ref refs/heads/main \
                    --source-digest "$commit" \
                    --deny-self-hosted-runners
                jq --null-input --arg repository "$repository" --arg asset "$name" \
                  --arg source_commit "$commit" '{
                    schema_version: 1,
                    kind: "latchway_authenticated_build_attestation",
                    repository: $repository,
                    asset: $asset,
                    source_commit: $source_commit,
                    status: "verified"
                  }' > "$directory/build-attestations/$name.json"
              fi
            done < <(jq --raw-output '.assets[].name' "$directory/release.json")
          }

          javascript_assets=(
            "latchway-client-$JAVASCRIPT_VERSION.tgz"
            SHA256SUMS
            build-reproducibility.json
            contract-evidence.json
            package-evidence.json
            post-publish-evidence.json
            publish-input-evidence.json
            release-candidate-evidence.json
            tag-evidence.json
            npm-registry-version.json
            npm-registry-view.json
            npm-attestations.json
            npm-audit-signatures.json
            npm-registry-evidence-manifest.json
          )
          ios_assets=(
            "latchway-ios-sdk-$IOS_VERSION.tar.gz"
            "latchway-ios-sdk-$IOS_VERSION.tar.gz.sha256"
            cocoapods-published-podspec.json
            cocoapods-reviewed-podspec.json
            cocoapods-release-evidence.json
            cocoapods-release-evidence.SHA256SUMS
          )
          android_assets=(
            "latchway-android-$ANDROID_VERSION-maven-repository.zip"
            "latchway-android-$ANDROID_VERSION-central-portal.zip"
            SHA256SUMS
            github-release-tag-binding.json
            latchway-maven-signing-public-key.asc
            maven-central-upload-intent.json
            maven-central-deployment.json
            maven-central-deployment-status.json
            maven-central-release-evidence.json
          )
          authenticate_release javascript Latchway/latchway-js \
            "v$JAVASCRIPT_VERSION" "$JAVASCRIPT_COMMIT" "${javascript_assets[@]}"
          authenticate_release ios Latchway/latchway-ios-sdk \
            "v$IOS_VERSION" "$IOS_COMMIT" "${ios_assets[@]}"
          authenticate_release android Latchway/latchway-android \
            "v$ANDROID_VERSION" "$ANDROID_COMMIT" "${android_assets[@]}"
          mkdir -m 700 "$root/core"
          authenticate_tag Latchway/latchway "$CORE_TAG" "$CORE_COMMIT" "$root/core"
      - name: Transfer authenticated inputs to credential-free validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-published-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-dependency-inputs
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    name: Verify immutable release inputs
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: [promote, locked-sources, published-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.promote.outputs.tag }}
    steps:
      - name: Check out exact promoted React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.commit }}
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Validate promoted annotated tag without credentials
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "${{ needs.promote.outputs.commit }}"
        working-directory: latchway-react-native-sdk
      - name: Read immutable compatibility lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          lock=release-compatibility.json
          emit() {
            local name=$1 filter=$2 value
            value=$(jq --exit-status --raw-output "$filter | strings" "$lock")
            [[ "$value" =~ ^[0-9A-Za-z@./_-]+$ ]]
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          }
          emit android_commit .android.source_commit
          emit android_build_tools_version .android.build_tools_version
          emit android_compile_sdk '.android.compile_sdk | tostring'
          emit android_ndk_version .android.ndk_version
          emit android_sdk_platform_version .android.sdk_platform_version
          emit android_version .android.version
          emit contract_version .contract.version
          emit core_commit .contract.core_commit
          emit ios_commit .ios.source_commit
          emit ios_version .ios.version
          emit javascript_commit .javascript.source_commit
          emit javascript_version .javascript.version
          emit react_native_version .react_native.version
          [[ "$(jq --raw-output .android.source_commit "$lock")" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(jq --raw-output .ios.source_commit "$lock")" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(jq --raw-output .javascript.source_commit "$lock")" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(jq --raw-output .contract.core_commit "$lock")" =~ ^[0-9a-f]{40}$ ]]
        working-directory: latchway-react-native-sdk
      - name: Download authenticated locked JavaScript source without credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-latchway-js-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-source-bundles
      - name: Download authenticated locked iOS source without credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-latchway-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-source-bundles
      - name: Download authenticated locked Android source without credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-latchway-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-source-bundles
      - name: Download authenticated locked core source without credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-latchway-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-source-bundles
      - name: Download authenticated published dependency inputs without credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: authenticated-published-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-dependency-inputs
      - name: Materialize authenticated source bundles without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-local "$RUNNER_TEMP/locked-source-bundles/locked-latchway-js.bundle" latchway-js
          git clone --no-local "$RUNNER_TEMP/locked-source-bundles/locked-latchway-ios.bundle" latchway-ios-sdk
          git clone --no-local "$RUNNER_TEMP/locked-source-bundles/locked-latchway-android.bundle" latchway-android
          git clone --no-local "$RUNNER_TEMP/locked-source-bundles/locked-latchway-core.bundle" latchway
          test "$(git -C latchway-js rev-parse --verify HEAD)" = "${{ steps.lock.outputs.javascript_commit }}"
          test "$(git -C latchway-ios-sdk rev-parse --verify HEAD)" = "${{ steps.lock.outputs.ios_commit }}"
          test "$(git -C latchway-android rev-parse --verify HEAD)" = "${{ steps.lock.outputs.android_commit }}"
          test "$(git -C latchway rev-parse --verify HEAD)" = "${{ steps.lock.outputs.core_commit }}"
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Build exact JavaScript source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: latchway-js
      - name: Install exact React Native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Verify tag, release metadata, and all locked source commits
        run: |
          pnpm release:preflight -- "$RELEASE_TAG"
          pnpm verify:compatibility --sources
        working-directory: latchway-react-native-sdk
      - name: Validate authenticated release inputs and wait for exact public registry bytes
        env:
          LATCHWAY_AUTHENTICATED_DEPENDENCY_INPUTS: ${{ runner.temp }}/published-dependency-inputs
          LATCHWAY_PUBLISHED_DEPENDENCY_EVIDENCE: ${{ runner.temp }}/published-dependency-evidence.json
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          for attempt in $(seq 1 180); do
            rm -f -- "$LATCHWAY_PUBLISHED_DEPENDENCY_EVIDENCE"
            if node scripts/verify-published-dependencies.mjs --all; then
              test -s "$LATCHWAY_PUBLISHED_DEPENDENCY_EVIDENCE"
              exit 0
            fi
            if [[ "$attempt" -eq 180 ]]; then
              echo "Locked public SDK bytes did not become verifiable within 90 minutes." >&2
              exit 1
            fi
            sleep 30
          done
        working-directory: latchway-react-native-sdk
      - name: Build and verify immutable core contract bundle
        run: |
          mkdir -p "$RUNNER_TEMP/latchway-contract"
          python3 scripts/build-contract-bundle.py --output-directory "$RUNNER_TEMP/latchway-contract"
          pnpm --dir ../latchway-react-native-sdk verify:bundle -- "$RUNNER_TEMP/latchway-contract/latchway-contract-${{ steps.lock.outputs.contract_version }}.tar.gz"
        working-directory: latchway
      - name: Run JavaScript and package release gates
        run: |
          pnpm check
          pnpm pack:check
          pnpm verify:reproducible
          pnpm consumer:check --published
        working-directory: latchway-react-native-sdk
      - name: Build deterministic source-provenanced documentation bundle
        run: |
          python3 scripts/build_docs_bundle.py \
            --output-dir .artifacts \
            --version "${{ steps.lock.outputs.react_native_version }}" \
            --commit "${{ needs.promote.outputs.commit }}" \
            --require-clean
        working-directory: latchway-react-native-sdk
      - name: Stage exact published-dependency evidence with the package
        run: install -m 600 "$RUNNER_TEMP/published-dependency-evidence.json" .artifacts/published-dependency-evidence.json
        working-directory: latchway-react-native-sdk
      - name: Upload immutable release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-react-native-release
          path: |
            latchway-react-native-sdk/.artifacts/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz
            latchway-react-native-sdk/.artifacts/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256
            latchway-react-native-sdk/.artifacts/docs-bundle-${{ steps.lock.outputs.react_native_version }}.tar.gz
            latchway-react-native-sdk/.artifacts/package-evidence.json
            latchway-react-native-sdk/.artifacts/build-reproducibility.json
            latchway-react-native-sdk/.artifacts/published-dependency-evidence.json
          if-no-files-found: error
          retention-days: 30

  android:
    name: Verify published Android consumer
    needs: [promote, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact promoted React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

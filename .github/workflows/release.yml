      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: >-
          sdkmanager
          "platforms;android-${{ steps.lock.outputs.android_sdk_platform_version }}"
          "build-tools;${{ steps.lock.outputs.android_build_tools_version }}"
          "ndk;${{ steps.lock.outputs.android_ndk_version }}"
      - name: Build exact JavaScript source and install workspace

name: Release

on:
  repository_dispatch:
    types: [latchway_release_promoted]

permissions:
  contents: read

concurrency:
  group: react-native-release-${{ github.event.client_payload.repository.commit }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0
  NPM_VERSION: 11.6.2

jobs:
  promote:
    name: Verify core promotion and create SDK tag
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: write
    outputs:
      commit: ${{ steps.promotion.outputs.release_commit }}
      tag: ${{ steps.promotion.outputs.release_tag }}
      version: ${{ steps.promotion.outputs.release_version }}
    steps:
      - name: Check out exact promoted React Native source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.client_payload.repository.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch envelope before network access
        shell: bash
        env:
          SDK_ID: ${{ github.event.client_payload.repository.id }}
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$SDK_ID" = react_native
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$SDK_TAG" = "v$SDK_VERSION"
          [[ "$CORE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          test "$GITHUB_SHA" = "$SDK_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$SDK_COMMIT"
      - name: Download and hash the exact core promotion report
        shell: bash
        env:
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 2097152 \
            --fail --location --silent --show-error --output "$report" "$REPORT_URL"
          printf '%s  %s\n' "$REPORT_SHA256" "$report" | sha256sum --check --strict
      - name: Verify the core workflow artifact attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/require-gh-version.py
          gh attestation verify "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --repo Latchway/latchway \
            --signer-workflow Latchway/latchway/.github/workflows/cross-repository-conformance.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Validate exact report, dispatch, and local source bindings
        id: promotion
        shell: bash
        env:
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          python3 scripts/verify-release-promotion.py \
            --report "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --report-url "$REPORT_URL" \
            --report-sha256 "$REPORT_SHA256" \
            --repository-id react_native \
            --repository-commit "$SDK_COMMIT" \
            --repository-version "$SDK_VERSION" \
            --repository-tag "$SDK_TAG" \
            --workflow-commit "$GITHUB_SHA" \
            --core-tag "$CORE_TAG" \
            --oci-image-digest "$OCI_IMAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create or verify evidence-gated annotated SDK tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.promotion.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.promotion.outputs.release_tag }}
          CORE_TAG: ${{ steps.promotion.outputs.core_tag }}
          REPORT_SHA256: ${{ steps.promotion.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          message="React Native SDK $RELEASE_TAG

          Core promotion: $CORE_TAG
          Promotion evidence SHA-256: $REPORT_SHA256"
          remote=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$remote" ]]; then
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.type)" = commit
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)" = "$RELEASE_COMMIT"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .message)" = "$message"
          else
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" \
              --arg object "$RELEASE_COMMIT" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
              > "$RUNNER_TEMP/sdk-tag-object.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/sdk-tag-object.json" > "$RUNNER_TEMP/sdk-tag-result.json"
            tag_object=$(jq --raw-output .sha "$RUNNER_TEMP/sdk-tag-result.json")
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" \
              '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/sdk-tag-ref.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/sdk-tag-ref.json" >/dev/null
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

  verify:
    name: Verify immutable release inputs
    if: github.repository == 'Latchway/latchway-react-native-sdk'
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      attestations: read
      contents: read
    env:
      RELEASE_TAG: ${{ needs.promote.outputs.tag }}
    steps:
      - name: Check out exact promoted React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.commit }}
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch promoted annotated tag
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "${{ needs.promote.outputs.commit }}"
        working-directory: latchway-react-native-sdk
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - name: Check out locked JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ steps.lock.outputs.javascript_commit }}
          path: latchway-js
          persist-credentials: false
      - name: Check out locked iOS SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-ios-sdk
          ref: ${{ steps.lock.outputs.ios_commit }}
          path: latchway-ios-sdk
          persist-credentials: false
      - name: Check out locked Android SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-android
          ref: ${{ steps.lock.outputs.android_commit }}
          path: latchway-android
          persist-credentials: false
      - name: Check out locked core contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ steps.lock.outputs.core_commit }}
          path: latchway
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Build exact JavaScript source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: latchway-js
      - name: Install exact React Native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Verify tag, release metadata, and all locked source commits
        run: |
          pnpm release:preflight -- "$RELEASE_TAG"
          pnpm verify:compatibility --sources
        working-directory: latchway-react-native-sdk
      - name: Wait for verified locked public SDK releases
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_VERSION: ${{ steps.lock.outputs.android_version }}
          IOS_VERSION: ${{ steps.lock.outputs.ios_version }}
          LATCHWAY_CENTRAL_VERIFY_ATTEMPTS: 180
          LATCHWAY_CENTRAL_VERIFY_DELAY_SECONDS: 30
          LATCHWAY_COCOAPODS_VERIFY_ATTEMPTS: 180
          LATCHWAY_COCOAPODS_VERIFY_DELAY_SECONDS: 30
          LATCHWAY_PUBLISHED_DEPENDENCY_EVIDENCE: ${{ runner.temp }}/published-dependency-evidence.json
        run: |
          wait_for_coordinates() {
            for attempt in $(seq 1 180); do
              if node scripts/verify-published-dependencies.mjs --all; then
                return 0
              fi
              if [[ "$attempt" -eq 180 ]]; then
                echo "Locked SDK coordinates did not become verifiable within 90 minutes." >&2
                return 1
              fi
              sleep 30
            done
          }

          wait_for_coordinates &
          coordinates_pid=$!
          ../latchway-ios-sdk/scripts/verify-cocoapods-release.sh "$IOS_VERSION" &
          ios_pid=$!
          ../latchway-android/scripts/verify-central-release.sh "$ANDROID_VERSION" &
          android_pid=$!

          status=0
          wait "$coordinates_pid" || status=1
          wait "$ios_pid" || status=1
          wait "$android_pid" || status=1
          test "$status" -eq 0
        working-directory: latchway-react-native-sdk
      - name: Build and verify immutable core contract bundle
        run: |
          mkdir -p "$RUNNER_TEMP/latchway-contract"
          python3 scripts/build-contract-bundle.py --output-directory "$RUNNER_TEMP/latchway-contract"
          pnpm --dir ../latchway-react-native-sdk verify:bundle -- "$RUNNER_TEMP/latchway-contract/latchway-contract-${{ steps.lock.outputs.contract_version }}.tar.gz"
        working-directory: latchway
      - name: Run JavaScript and package release gates
        run: |
          pnpm check
          pnpm pack:check
          pnpm verify:reproducible
          pnpm consumer:check --published
        working-directory: latchway-react-native-sdk
      - name: Stage exact published-dependency evidence with the package
        run: install -m 600 "$RUNNER_TEMP/published-dependency-evidence.json" .artifacts/published-dependency-evidence.json
        working-directory: latchway-react-native-sdk
      - name: Upload immutable release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latchway-react-native-release
          path: |
            latchway-react-native-sdk/.artifacts/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz
            latchway-react-native-sdk/.artifacts/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256
            latchway-react-native-sdk/.artifacts/package-evidence.json
            latchway-react-native-sdk/.artifacts/build-reproducibility.json
            latchway-react-native-sdk/.artifacts/published-dependency-evidence.json
          if-no-files-found: error
          retention-days: 30

  android:
    name: Verify published Android consumer
    needs: [promote, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact promoted React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.commit }}
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - name: Check out locked JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ steps.lock.outputs.javascript_commit }}
          path: latchway-js
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: sdkmanager "platforms;android-${{ steps.lock.outputs.android_compile_sdk }}" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Build exact JavaScript source and install workspace
        run: |
          pnpm --dir ../latchway-js install --frozen-lockfile
          pnpm --dir ../latchway-js build
          pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Compile standalone bridge against public Maven coordinates
        run: ./android/gradlew -p android clean check --no-daemon
        working-directory: latchway-react-native-sdk
      - name: Compile and lint official Android host
        run: ./android/gradlew -p example/android :app:compileDebugKotlin :app:lintDebug --no-daemon
        working-directory: latchway-react-native-sdk

  ios:
    name: Verify published iOS consumer
    needs: [promote, verify]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out exact promoted React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.commit }}
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - name: Check out locked JavaScript SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-js
          ref: ${{ steps.lock.outputs.javascript_commit }}
          path: latchway-js
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build exact JavaScript source and install workspace
        run: |
          pnpm --dir ../latchway-js install --frozen-lockfile
          pnpm --dir ../latchway-js build
          pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Resolve public CocoaPods dependency
        env:
          RCT_NEW_ARCH_ENABLED: "1"
        run: pod install --repo-update
        working-directory: latchway-react-native-sdk/example/ios
      - name: Build official iOS host
        run: >-
          xcodebuild
          -workspace LatchwayExample.xcworkspace
          -scheme LatchwayExample
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/latchway-rn-ios-release"
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: latchway-react-native-sdk/example/ios

  publish:
    name: Publish npm package and GitHub release
    needs: [promote, verify, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
      RELEASE_TAG: ${{ needs.promote.outputs.tag }}
    steps:
      - name: Check out exact promoted React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.commit }}
          path: latchway-react-native-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Read immutable compatibility lock
        id: lock
        run: node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latchway-react-native-release
          path: .release
      - name: Verify downloaded archive checksum and release tag
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          (cd ../.release && sha256sum --check "latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256")
          node scripts/release-preflight.mjs "$RELEASE_TAG"
        working-directory: latchway-react-native-sdk
      - name: Require GitHub immutable-release attestation tooling
        run: |
          set -euo pipefail
          python3 scripts/require-gh-version.py
          verify_help=$(gh release verify --help)
          verify_asset_help=$(gh release verify-asset --help)
          grep --fixed-strings -- '--format' <<<"$verify_help" >/dev/null
          grep --fixed-strings -- '--format' <<<"$verify_asset_help" >/dev/null
      - name: Create or resume the fail-closed GitHub draft
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          python3 scripts/reconcile-github-release.py \
            --prepare-draft \
            --npm-adoption-history \
            --expected-commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            "${prerelease[@]}" \
            --expected-asset-name "latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz" \
            --expected-asset-name "latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz.sha256" \
            --expected-asset-name package-evidence.json \
            --expected-asset-name build-reproducibility.json \
            --expected-asset-name published-dependency-evidence.json \
            --expected-asset-name npm-registry-version.json \
            --expected-asset-name npm-registry-view.json \
            --expected-asset-name npm-attestations.json \
            --expected-asset-name npm-audit-signatures.json \
            --expected-asset-name npm-registry-evidence-manifest.json \
            --expected-asset-name post-publish-evidence.json
        working-directory: latchway-react-native-sdk
      - name: Attest reviewed npm package and reproducibility inputs
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            .release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz
            .release/package-evidence.json
            .release/build-reproducibility.json
            .release/published-dependency-evidence.json
      - name: Publish or adopt the exact npm archive with trusted publishing
        id: registry
        env:
          RELEASE_STATE: ${{ steps.github_release.outputs.release_state }}
        run: node scripts/publish-or-verify.mjs "../.release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz"
        working-directory: latchway-react-native-sdk
      - name: Verify registry bytes, signatures, and exact trusted-publisher provenance
        id: registry_evidence
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          PUBLISH_PERFORMED: ${{ steps.registry.outputs.publish_performed }}
        run: node scripts/verify-published.mjs "../.release/latchway-react-native-${{ steps.lock.outputs.react_native_version }}.tgz"
        working-directory: latchway-react-native-sdk
      - name: Attest exact retained registry and adoption evidence
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            .release/npm-registry-version.json
            .release/npm-registry-view.json
            .release/npm-attestations.json
            .release/npm-audit-signatures.json
            .release/npm-registry-evidence-manifest.json
            .release/post-publish-evidence.json
            .release/${{ steps.registry_evidence.outputs.adoption_asset }}
      - name: Attach every fixed asset, publish once, and require immutability
        env:
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          python3 scripts/reconcile-github-release.py \
            --npm-adoption-history \

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0

jobs:
  pull-request:
    name: Hermetic pull-request policy and source checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out React Native SDK without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan the exact candidate dependency inventory offline
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - name: Resolve the exact locked JavaScript SDK revision
        id: javascript
        shell: bash
        run: |
          set -euo pipefail
          commit=$(jq --exit-status --raw-output '.javascript.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' release-compatibility.json)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Fetch only the public exact locked JavaScript SDK revision without credentials
        env:
          JAVASCRIPT_COMMIT: ${{ steps.javascript.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test ! -e ../latchway-js
          git init ../latchway-js
          git -C ../latchway-js remote add origin https://github.com/Latchway/latchway-js.git
          GIT_TERMINAL_PROMPT=0 git -C ../latchway-js fetch --depth=1 --no-tags origin "$JAVASCRIPT_COMMIT"
          git -C ../latchway-js checkout --detach FETCH_HEAD
          test "$(git -C ../latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test -z "$(git -C ../latchway-js status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Build the exact locked JavaScript SDK source
        env:
          JAVASCRIPT_COMMIT: ${{ steps.javascript.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test -z "$(git -C ../latchway-js status --porcelain=v1 --untracked-files=all)"
          pnpm --dir ../latchway-js install --frozen-lockfile --ignore-scripts
          pnpm --dir ../latchway-js build
          test -z "$(git -C ../latchway-js status --porcelain=v1 --untracked-files=all)"
      - name: Install the exact package graph
        run: pnpm install --frozen-lockfile
      - name: Verify candidate-owned metadata and native boundaries
        run: |
          node scripts/verify-contract.mjs
          node scripts/verify-compatibility.mjs --metadata-only
          node scripts/verify-native-boundary.mjs
      - name: Run dependency-free workflow and evidence tests
        run: |
          node --test scripts/test-ci-lock-output.mjs scripts/test-package-archive.mjs
          python3 scripts/test-dependency-vulnerability-scan.py
          python3 scripts/test-device-evidence.py
          python3 scripts/test-locked-sources-workflow.py
          python3 scripts/test-physical-evidence-workflow.py
          python3 scripts/test-development-example-host.py
          python3 scripts/test-development-react-native-ios-env.py
          python3 scripts/test-physical-example-host.py
          python3 scripts/test-physical-candidate-producer.py
          python3 scripts/test-finalize-react-native-device-run.py
          python3 scripts/test-export-core-physical-evidence.py
          python3 scripts/test-verify-gateway-deployment.py
          python3 scripts/test_release_promotion.py
          python3 scripts/test_require_gh_version.py
          python3 -m unittest scripts/test_build_docs_bundle.py
          bash -n scripts/gateway-deployment-evidence.sh
          bash -n scripts/run-physical-react-native-ios.sh
          bash -n scripts/run-physical-react-native-android.sh
          bash -n scripts/copy-protected-firebase-ios-config.sh
          bash -n scripts/copy-development-firebase-ios-config.sh
          bash -n scripts/run-development-react-native-ios.sh
      - name: Build the package and run unit, wire, DPoP, codegen, and consumer gates
        run: pnpm check

  pinned-core-conformance:
    name: Pinned core plus React Native package/native split conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: latchway
          POSTGRES_USER: latchway
          POSTGRES_PASSWORD: latchway-react-native-pr-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latchway -d latchway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LATCHWAY_CONFORMANCE_DATABASE_URL: postgres://latchway:latchway-react-native-pr-ci@127.0.0.1:5432/latchway?sslmode=disable
    steps:
      - name: Check out the React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the exact locked core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          commit=$(awk '$1 == "core_commit:" {print $2}' contract.lock)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Fetch only the public exact locked core revision without credentials
        env:
          CORE_COMMIT: ${{ steps.core.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          git init _core
          git -C _core remote add origin https://github.com/Latchway/latchway.git
          GIT_TERMINAL_PROMPT=0 git -C _core fetch --depth=1 --no-tags origin "$CORE_COMMIT"
          git -C _core checkout --detach FETCH_HEAD
          test "$(git -C _core rev-parse --verify HEAD)" = "$CORE_COMMIT"
      - name: Resolve the exact locked JavaScript SDK revision
        id: javascript
        shell: bash
        run: |
          set -euo pipefail
          commit=$(jq --exit-status --raw-output '.javascript.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' release-compatibility.json)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Fetch only the public exact locked JavaScript SDK revision without credentials
        env:
          JAVASCRIPT_COMMIT: ${{ steps.javascript.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test ! -e ../latchway-js
          git init ../latchway-js
          git -C ../latchway-js remote add origin https://github.com/Latchway/latchway-js.git
          GIT_TERMINAL_PROMPT=0 git -C ../latchway-js fetch --depth=1 --no-tags origin "$JAVASCRIPT_COMMIT"
          git -C ../latchway-js checkout --detach FETCH_HEAD
          test "$(git -C ../latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test -z "$(git -C ../latchway-js status --porcelain=v1 --untracked-files=all)"
      - name: Resolve the exact locked Android SDK revision
        id: android
        shell: bash
        run: |
          set -euo pipefail
          commit=$(jq --exit-status --raw-output '.android.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' release-compatibility.json)
          version=$(jq --exit-status --raw-output '.android.version | select(type == "string")' release-compatibility.json)
          sdk_platform=$(jq --exit-status --raw-output '.android.sdk_platform_version | select(type == "string")' release-compatibility.json)
          build_tools=$(jq --exit-status --raw-output '.android.build_tools_version | select(type == "string")' release-compatibility.json)
          test "$version" = 1.0.0
          printf 'commit=%s\nversion=%s\nsdk_platform=%s\nbuild_tools=%s\n' \
            "$commit" "$version" "$sdk_platform" "$build_tools" >> "$GITHUB_OUTPUT"
      - name: Fetch only the public exact locked Android SDK revision without credentials
        env:
          ANDROID_COMMIT: ${{ steps.android.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          git init _android_sdk
          git -C _android_sdk remote add origin https://github.com/Latchway/latchway-android.git
          GIT_TERMINAL_PROMPT=0 git -C _android_sdk fetch --depth=1 --no-tags origin "$ANDROID_COMMIT"
          git -C _android_sdk checkout --detach FETCH_HEAD
          test "$(git -C _android_sdk rev-parse --verify HEAD)" = "$ANDROID_COMMIT"
          test -z "$(git -C _android_sdk status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Build the exact locked JavaScript SDK source
        env:
          JAVASCRIPT_COMMIT: ${{ steps.javascript.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../latchway-js rev-parse --verify HEAD)" = "$JAVASCRIPT_COMMIT"
          test -z "$(git -C ../latchway-js status --porcelain=v1 --untracked-files=all)"
          pnpm --dir ../latchway-js install --frozen-lockfile --ignore-scripts
          pnpm --dir ../latchway-js build
          test -z "$(git -C ../latchway-js status --porcelain=v1 --untracked-files=all)"
      - name: Install the exact React Native package graph
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install the exact Android compile platform
        env:
          SDK_PLATFORM_VERSION: ${{ steps.android.outputs.sdk_platform }}
          BUILD_TOOLS_VERSION: ${{ steps.android.outputs.build_tools }}
        shell: bash
        run: |
          set -euo pipefail
          # The exact locked source owns and verifies its matching SDK package IDs.
          test "$SDK_PLATFORM_VERSION" = 37.0
          test "$BUILD_TOOLS_VERSION" = 36.0.0
          ./_android_sdk/scripts/install-android-sdk.sh
      - name: Build local Maven publications from the exact locked Android source
        env:
          ANDROID_COMMIT: ${{ steps.android.outputs.commit }}
          ANDROID_VERSION: ${{ steps.android.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _android_sdk rev-parse --verify HEAD)" = "$ANDROID_COMMIT"
          test -z "$(git -C _android_sdk status --porcelain=v1 --untracked-files=all)"
          ./_android_sdk/gradlew -p _android_sdk \
            :latchway-core:publishReleasePublicationToPublicationTestRepository \
            :latchway-okhttp:publishReleasePublicationToPublicationTestRepository \
            -Platchway.version="$ANDROID_VERSION" --no-daemon --stacktrace
          test -f "_android_sdk/build/publication-test-repository/dev/latchway/latchway-core/$ANDROID_VERSION/latchway-core-$ANDROID_VERSION.aar"
          test -f "_android_sdk/build/publication-test-repository/dev/latchway/latchway-okhttp/$ANDROID_VERSION/latchway-okhttp-$ANDROID_VERSION.aar"
          test -z "$(git -C _android_sdk status --porcelain=v1 --untracked-files=all)"
      - name: Load the contract bundle and run the exact core image plus split SDK vertical
        env:
          LATCHWAY_SDK_KIND: react_native
          LATCHWAY_CORE_DIR: _core
          LATCHWAY_EVIDENCE_DIR: ${{ runner.temp }}/latchway-react-native-pr-core-conformance
          LATCHWAY_ANDROID_SOURCE_DIR: _android_sdk
          LATCHWAY_ANDROID_SOURCE_COMMIT: ${{ steps.android.outputs.commit }}
          LATCHWAY_NATIVE_REPOSITORY: ${{ github.workspace }}/_android_sdk/build/publication-test-repository
        run: sh scripts/run-pr-core-conformance.sh sh scripts/run-pr-react-native-live-conformance.sh
      - name: Retain exact-image conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-react-native-pr-core-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-react-native-pr-core-conformance/
          if-no-files-found: error
          retention-days: 14

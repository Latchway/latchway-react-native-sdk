name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out React Native SDK
        uses: actions/checkout@v4
        with:
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Check out JavaScript SDK development dependency
        uses: actions/checkout@v4
        with:
          repository: Latchway/latchway-js
          ref: 273925d73a5a959f95664b1b1d838505dcce5f6c
          path: latchway-js
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Verify source, tests, codegen, example, and boundaries
        run: pnpm check
        working-directory: latchway-react-native-sdk
      - name: Verify published archive shape
        run: pnpm pack:check
        working-directory: latchway-react-native-sdk
      - name: Verify deterministic build
        run: pnpm verify:reproducible
        working-directory: latchway-react-native-sdk

  podspec:
    runs-on: macos-15
    steps:
      - name: Check out React Native SDK
        uses: actions/checkout@v4
        with:
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Check out JavaScript SDK development dependency
        uses: actions/checkout@v4
        with:
          repository: Latchway/latchway-js
          ref: 273925d73a5a959f95664b1b1d838505dcce5f6c
          path: latchway-js
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Parse CocoaPods specification
        run: pnpm ios:spec
        working-directory: latchway-react-native-sdk

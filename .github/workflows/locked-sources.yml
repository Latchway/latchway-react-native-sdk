          retention-days: 14

  android-source:
    name: Android source publication and RN 0.82 host without credentials
    if: github.ref == 'refs/heads/main'
    needs: authenticate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out exact React Native candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: latchway-react-native-sdk
          persist-credentials: false
      - name: Download authenticated locked sources without credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: authenticated-locked-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/locked-sources-artifact
      - name: Validate exact closure and import every locked source offline
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.authenticate-inputs.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          for name in GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN; do
            test -z "${!name:-}"
          done
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          artifact="$RUNNER_TEMP/locked-sources-artifact/locked-sources-inputs.tar"
          test -f "$artifact"
          test "$(find "$RUNNER_TEMP/locked-sources-artifact" -type f | wc -l | tr -d ' ')" -eq 1
          bytes=$(wc -c < "$artifact" | tr -d ' ')
          [[ "$bytes" =~ ^[1-9][0-9]*$ ]]
          (( bytes <= 1717986918 ))
          test "$(shasum -a 256 "$artifact" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          expected_files=(
            contract.lock
            locked-latchway-android.bundle
            locked-latchway-ios-sdk.bundle
            locked-latchway-js.bundle
            locked-latchway.bundle
            release-compatibility.json
          )
          expected_entries="$RUNNER_TEMP/locked-sources-expected-entries.txt"
          actual_entries="$RUNNER_TEMP/locked-sources-tar-entries.txt"
          {
            printf '%s\n' authenticated-locked-sources/
            printf 'authenticated-locked-sources/%s\n' "${expected_files[@]}"
            printf '%s\n' authenticated-locked-sources/MANIFEST.sha256
          } | LC_ALL=C sort > "$expected_entries"
          tar -tf "$artifact" | LC_ALL=C sort > "$actual_entries"
          cmp -s "$expected_entries" "$actual_entries"
          extraction="$RUNNER_TEMP/locked-sources-inputs"
          mkdir -m 700 "$extraction"
          tar -xf "$artifact" -C "$extraction"
          root="$extraction/authenticated-locked-sources"
          test -z "$(find "$root" ! -type d ! -type f -print)"
          expected_paths="$RUNNER_TEMP/locked-sources-expected-paths.txt"
          actual_paths="$RUNNER_TEMP/locked-sources-actual-paths.txt"
          manifest_paths="$RUNNER_TEMP/locked-sources-manifest-paths.txt"
          printf './%s\n' "${expected_files[@]}" | LC_ALL=C sort > "$expected_paths"
          (cd "$root" && find . -type f ! -name MANIFEST.sha256 -print | LC_ALL=C sort) > "$actual_paths"
          cmp -s "$expected_paths" "$actual_paths"
          while IFS=' ' read -r digest relative extra; do
            test -z "${extra:-}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            grep -F -x -- "$relative" "$expected_paths" >/dev/null
            file="$root/${relative#./}"
            test -f "$file"
            file_bytes=$(wc -c < "$file" | tr -d ' ')
            [[ "$file_bytes" =~ ^[1-9][0-9]*$ ]]
            (( file_bytes <= 536870912 ))
            test "$(shasum -a 256 "$file" | awk '{print $1}')" = "$digest"
            printf '%s\n' "$relative" >> "$manifest_paths"
          done < "$root/MANIFEST.sha256"
          LC_ALL=C sort -o "$manifest_paths" "$manifest_paths"
          cmp -s "$expected_paths" "$manifest_paths"
          cmp -s "$root/release-compatibility.json" latchway-react-native-sdk/release-compatibility.json
          cmp -s "$root/contract.lock" latchway-react-native-sdk/contract.lock
          materialize_bundle() {
            local bundle=$1 directory=$2 commit=$3
            test "$(git bundle list-heads "$bundle")" = "$commit refs/heads/authenticated"
            git clone --no-local --branch authenticated --single-branch "$bundle" "$directory"
            test "$(git -C "$directory" rev-parse --verify HEAD)" = "$commit"
            test -z "$(git -C "$directory" status --porcelain)"
          }
          JAVASCRIPT_COMMIT=$(jq --exit-status --raw-output '.javascript.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$root/release-compatibility.json")
          ANDROID_COMMIT=$(jq --exit-status --raw-output '.android.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$root/release-compatibility.json")
          IOS_COMMIT=$(jq --exit-status --raw-output '.ios.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$root/release-compatibility.json")
          CORE_COMMIT=$(jq --exit-status --raw-output '.contract.core_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$root/release-compatibility.json")
          materialize_bundle "$root/locked-latchway-js.bundle" latchway-js "$JAVASCRIPT_COMMIT"
          materialize_bundle "$root/locked-latchway-android.bundle" latchway-android "$ANDROID_COMMIT"
          materialize_bundle "$root/locked-latchway-ios-sdk.bundle" latchway-ios-sdk "$IOS_COMMIT"
          materialize_bundle "$root/locked-latchway.bundle" latchway "$CORE_COMMIT"
      - name: Read the authenticated immutable compatibility lock without credentials
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          for name in GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN; do
            test -z "${!name:-}"
          done
          node scripts/ci-lock-output.mjs >> "$GITHUB_OUTPUT"
        working-directory: latchway-react-native-sdk
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install locked Android build platforms
        run: >-
          sdkmanager
          "platforms;android-${{ steps.lock.outputs.android_sdk_platform_version }}"
          "build-tools;${{ steps.lock.outputs.android_build_tools_version }}"
          "ndk;${{ steps.lock.outputs.android_ndk_version }}"
      - name: Build the exact JavaScript dependency without credentials
        run: |
          set -euo pipefail
          for name in GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN; do test -z "${!name:-}"; done
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: latchway-js
      - name: Install exact React Native dependencies without credentials
        run: |
          set -euo pipefail
          for name in GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN; do test -z "${!name:-}"; done
          pnpm install --frozen-lockfile
        working-directory: latchway-react-native-sdk
      - name: Verify exact Android Maven publications and isolated consumers
        env:
          LATCHWAY_PUBLICATION_TEST_VERSION: ${{ steps.lock.outputs.android_version }}
        run: ./scripts/verify-local-publication.sh
        working-directory: latchway-android
      - name: Compile and lint standalone React Native library
        env:
          LATCHWAY_NATIVE_REPOSITORY: ${{ github.workspace }}/latchway-android/build/publication-test-repository
        run: ./android/gradlew -p android clean check --no-daemon
        working-directory: latchway-react-native-sdk
      - name: Compile and lint official React Native Android host
        env:
          LATCHWAY_NATIVE_REPOSITORY: ${{ github.workspace }}/latchway-android/build/publication-test-repository
        run: ./android/gradlew -p example/android :app:compileDebugKotlin :app:lintDebug --no-daemon
        working-directory: latchway-react-native-sdk


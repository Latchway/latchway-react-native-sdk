name: Scheduled framework compatibility

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-framework-compatibility-${{ github.ref }}
  cancel-in-progress: false

env:
  FRAMEWORK_CORE_COMMIT: d4693ee36bf8a018a027fb75e5e2ac2fb6b58d50
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0

jobs:
  compatibility:
    name: ${{ matrix.profile }} framework profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Registry minimum and latest are both the exact audited 0.82.0 tuple.
        profile: [registry-exact, newest-compatible]
    steps:
      - name: Check out the React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check out the canonical framework conformance checkpoint
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ env.FRAMEWORK_CORE_COMMIT }}
          path: _core
          persist-credentials: false
      - name: Validate the complete React Native registry report
        run: >-
          python3 _core/scripts/framework_conformance.py
          --manifest _core/conformance/framework-cases.json
          --registry _core/compatibility/frameworks.yaml
          --report Conformance/framework-report.json
          --require-repository latchway-react-native-sdk
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install the exact registry profile
        if: matrix.profile != 'newest-compatible'
        run: pnpm install --frozen-lockfile
      - name: Probe newest releases inside every reviewed compatibility line
        if: matrix.profile == 'newest-compatible'
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev \
            react-native@0.82.0 react@19.1.1 openai@7 ai@7 \
            @react-native/codegen@0.82.0 @react-native/gradle-plugin@0.82.0 \
            @ai-sdk/openai@4 @ai-sdk/anthropic@4 @langchain/openai@1.5
      - name: Run framework, type, and strict native-boundary gates
        id: framework-tests
        continue-on-error: true
        run: |
          pnpm exec vitest run test/framework-conformance.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit
          node scripts/verify-native-boundary.mjs
      - name: Emit machine-readable compatibility evidence
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
          OUTCOME: ${{ steps.framework-tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          package_version() { node -p "require('./node_modules/$1/package.json').version"; }
          python3 _core/scripts/framework_observation.py \
            --repository latchway-react-native-sdk \
            --profile "$PROFILE" \
            --outcome "$OUTCOME" \
            --report Conformance/framework-report.json \
            --version "ReactNative=$(package_version react-native)" \
            --version "OpenAI=$(package_version openai)" \
            --version "VercelAI=$(package_version ai)" \
            --version "AISDKOpenAI=$(package_version @ai-sdk/openai)" \
            --version "AISDKAnthropic=$(package_version @ai-sdk/anthropic)" \
            --version "LangChainOpenAI=$(package_version @langchain/openai)" \
            --output "$RUNNER_TEMP/react-native-framework-$PROFILE.json"
          pnpm list --depth 0 --json > "$RUNNER_TEMP/react-native-dependencies-$PROFILE.json"
      - name: Retain the report, resolved graph, and observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-native-framework-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/react-native-framework-${{ matrix.profile }}.json
            ${{ runner.temp }}/react-native-dependencies-${{ matrix.profile }}.json
            Conformance/framework-report.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence retention
        if: steps.framework-tests.outcome != 'success'
        run: exit 1

  native_refresh_ios:
    name: iOS native pre-dispatch refresh
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve and check out the locked iOS SDK
        id: ios
        shell: bash
        run: |
          set -euo pipefail
          commit=$(jq --raw-output '.ios.source_commit' release-compatibility.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the locked iOS implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-ios-sdk
          ref: ${{ steps.ios.outputs.commit }}
          path: _ios
          persist-credentials: false
      - name: Run the compiled public React Native iOS bridge conformance
        run: swift test --filter LatchwayNativeBridgeConformanceTests
      - name: Prove locked iOS bootstrap, refresh, revocation, and fresh-proof semantics
        run: sh Conformance/Tests/run-ios-locked-native-conformance.sh _ios

  native_refresh_android:
    name: Android native pre-dispatch refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the React Native SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the locked Android SDK
        id: android
        shell: bash
        run: |
          set -euo pipefail
          commit=$(jq --raw-output '.android.source_commit' release-compatibility.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the locked Android implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway-android
          ref: ${{ steps.android.outputs.commit }}
          path: _android
          persist-credentials: false
      - name: Configure Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install the exact React Native dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
      - name: Install the pinned Android platform
        run: _android/scripts/install-android-sdk.sh
      - name: Publish the exact locked Android SDK to an isolated Maven repository
        working-directory: _android
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.android.outputs.commit }}"
          ./gradlew \
            -Platchway.central.enabled=false \
            -Platchway.signing.enabled=false \
            -Platchway.version=1.0.0 \
            cleanPublicationTestRepository \
            publishPublicArtifactsToPublicationTestRepository \
            --no-daemon
          mkdir -p "$RUNNER_TEMP/latchway-native-repository"
          cp -R build/publication-test-repository/. "$RUNNER_TEMP/latchway-native-repository/"
          test -f "$RUNNER_TEMP/latchway-native-repository/dev/latchway/latchway-okhttp/1.0.0/latchway-okhttp-1.0.0.aar"
      - name: Run the compiled public React Native Android bridge conformance
        env:
          LATCHWAY_NATIVE_REPOSITORY: ${{ runner.temp }}/latchway-native-repository
        run: pnpm native:android:conformance
      - name: Prove locked Android bootstrap, refresh, revocation, and fresh-proof semantics
        run: sh Conformance/Tests/run-android-locked-native-conformance.sh _android

  issue-on-failure:
    name: Open one scheduled compatibility issue
    needs: [compatibility, native_refresh_ios, native_refresh_android]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.compatibility.result == 'failure' ||
      needs.native_refresh_ios.result == 'failure' ||
      needs.native_refresh_android.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Create or update the deduplicated issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled React Native framework compatibility failed"
        shell: bash
        run: |
          set -euo pipefail
          body="The registry-exact/newest-compatible framework matrix and locked native refresh gates failed. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

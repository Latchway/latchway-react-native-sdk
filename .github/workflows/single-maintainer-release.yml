name: Publish React Native SDK v1.1.1

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: latchway-react-native-v1.1.1-publication
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  NPM_VERSION: 11.6.2
  PNPM_VERSION: 10.15.0
  RELEASE_TAG: v1.1.1
  RELEASE_VERSION: 1.1.1

jobs:
  publish:
    name: Pack, publish, and release v1.1.1
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: single-maintainer-v1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install packaging tools
        run: |
          npm install --global "npm@$NPM_VERSION"
          pnpm install --frozen-lockfile
      - name: Build and pack v1.1.1
        run: |
          pnpm build
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --pack-destination "$RUNNER_TEMP/release"
      - name: Publish v1.1.1 with trusted npm publishing
        run: >-
          npm publish
          "$RUNNER_TEMP/release/latchway-react-native-$RELEASE_VERSION.tgz"
          --access public --provenance --tag latest
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/latchway-react-native-$RELEASE_VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latchway React Native SDK $RELEASE_VERSION" \
            --notes "React Native SDK $RELEASE_VERSION: only shared client and private stream fallback remain required runtime dependencies. LangChain runtime/Babel setup is app-owned and documented. Upgrade action: deprecated /polyfills and /babel exports remain, but their convenience dependencies are now optional peers and must be explicitly installed by helper users. See CHANGELOG.md and docs/langchain.md for commands. Core APIs, native client/App Attest/Android dependencies (1.0.0), and wire protocol are unchanged. This release does not claim fresh physical-device verification."

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def physicalCandidate = System.getenv("LATCHWAY_PHYSICAL_CANDIDATE") == "1"
def prohibitedRepositorySigningInputs = [
    "LATCHWAY_ANDROID_KEYSTORE_PATH",
    "LATCHWAY_ANDROID_KEYSTORE_PASSWORD",
    "LATCHWAY_ANDROID_KEY_ALIAS",
    "LATCHWAY_ANDROID_KEY_PASSWORD",
    "LATCHWAY_ANDROID_UPLOAD_CERTIFICATE_SHA256",
]
if (physicalCandidate && prohibitedRepositorySigningInputs.any { System.getenv(it) != null }) {
    throw new GradleException("signing material is prohibited in the unsigned repository build")
}
def firebaseConfiguration = file("google-services.json")
if (physicalCandidate && (!firebaseConfiguration.isFile() || java.nio.file.Files.isSymbolicLink(firebaseConfiguration.toPath()))) {
    throw new GradleException("physical Release candidate requires a safe external google-services.json")
}
if (firebaseConfiguration.isFile()) {
    apply plugin: "com.google.gms.google-services"
}

def requiredPhysicalEnvironment = { String name ->
    def value = System.getenv(name)
    if (!physicalCandidate) return value
    if (value == null || value.isBlank() || value.contains("\n") || value.contains("\r")) {
        throw new GradleException("required physical candidate environment is missing: ${name}")
    }
    return value
}

react {
    root = file("../..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    // The example lives below the pnpm workspace root, so Hermes cannot be
    // discovered below `root` using React Native's single-package default.
    hermesCommand = "${rootDir}/../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.latchwayexample"
    defaultConfig {
        applicationId physicalCandidate ? requiredPhysicalEnvironment("LATCHWAY_PACKAGE_NAME") : "com.latchwayexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode physicalCandidate ? requiredPhysicalEnvironment("LATCHWAY_VERSION_CODE").toInteger() : 1
        versionName physicalCandidate ? requiredPhysicalEnvironment("LATCHWAY_APP_VERSION") : "1.0.0"
        manifestPlaceholders.latchwayFirebaseConfigurationSHA256 = physicalCandidate
            ? requiredPhysicalEnvironment("LATCHWAY_FIREBASE_CONFIGURATION_SHA256") : "0" * 64
        manifestPlaceholders.latchwayCandidateConfigurationSHA256 = physicalCandidate
            ? requiredPhysicalEnvironment("LATCHWAY_CANDIDATE_CONFIGURATION_SHA256") : "0" * 64
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        disable "AndroidGradlePluginVersion", "NewerVersionAvailable"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
